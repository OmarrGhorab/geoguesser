      required: [id, email, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
    GuestSession:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
        display_name:
          type: string

    HomeResponse:
