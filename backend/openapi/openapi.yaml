      properties:
        media:
          $ref: '#/components/schemas/RoundMedia'
    RoundMedia:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [image, panorama]
        url:
          type: string
          format: uri
        panorama_id:
          type: string
          minLength: 8
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
        attribution:
          type: [string, 'null']

    CreateGameRequest:
      type: object
      required: [mode, map_id]
      additionalProperties: false
      description: Creates a fixed Solo game or an open-ended, untimed Practice session.
      properties:
        mode:
          $ref: '#/components/schemas/GameMode'
        map_id:
          type: string
          format: uuid
        round_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        timer_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 600
    GameResponse:
      type: object
      required: [game]
      properties:
        game:
          $ref: '#/components/schemas/Game'
    Game:
      type: object
      required:
        - id
        - mode
        - status
        - round_count
        - scoring_version
        - current_round_number
        - total_score
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/GameMode'
        status:
          $ref: '#/components/schemas/GameStatus'
        map_id:
          type: string
          format: uuid
        round_count:
          type: integer
        timer_seconds:
          type: [integer, 'null']
        scoring_version:
          type: integer
        current_round_number:
          type: [integer, 'null']
        total_score:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        open_ended:
          type: boolean
          description: True only for Practice sessions whose rounds are created on demand.
    GameMode:
      type: string
      enum: [solo, private_room, party_lobby, practice, quick_play, daily, ranked, casual_solo, casual_duo, casual_squad, ranked_solo, ranked_duo, ranked_squad]
    GameStatus:
      type: string
      enum: [pending, active, completed, abandoned, cancelled]
    CurrentRoundResponse:
      type: object
      required: [round]
      properties:
        round:
          $ref: '#/components/schemas/Round'
    Round:
      type: object
      required: [id, round_number, status, media]
      properties:
        id:
          type: string
          format: uuid
        round_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, active, completed, cancelled]
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        media:
          $ref: '#/components/schemas/RoundMedia'
    SubmitGuessRequest:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    GuessResultResponse:
      type: object
      required: [guess, max_score, score_percent, outcome]
      description: >
        Solo/daily always populate actual_location after accept. Multiplayer keeps
        actual_location null while round_completed is false. Compatibility aliases
        max_score and score_percent remain until solo clients migrate to
        max_accuracy_score / accuracy fields.
      properties:
        guess:
          $ref: '#/components/schemas/GuessResult'
        actual_location:
          anyOf:
            - $ref: '#/components/schemas/RevealedLocation'
            - type: 'null'
          description: Null for multiplayer until the shared round closes.
        max_score:
          type: integer
          const: 5000
          description: Legacy alias for max accuracy score (solo/daily compatibility).
        score_percent:
          type: integer
          minimum: 0
          maximum: 100
        max_accuracy_score:
          type: integer
          minimum: 0
          maximum: 5000
          description: Maximum accuracy points per round (typically 5000).
        max_speed_bonus:
          type: integer
          minimum: 0
          maximum: 250
          description: Maximum speed bonus per round (0 for casual; up to 250 ranked).
        outcome:
          type: string
          description: >
            Solo outcomes include perfect/close/miss/timed_out. Multiplayer may
            return submitted while the shared round remains open.
          enum: [perfect, close, miss, timed_out, submitted]
        round_completed:
          type: boolean
          description: True when the accepted guess closes the shared or solo round.
        game_completed:
          type: boolean
        submitted_count:
          type: integer
          minimum: 0
          description: Multiplayer aggregate of locked guesses for the current round.
        eligible_count:
          type: integer
          minimum: 0
          description: Multiplayer count of eligible participants for the current round.
        next_round_number:
          type: integer
          minimum: 1
        next_round_available:
          type: boolean
          description: True after an accepted Practice guess until the session is ended.
    PracticeHistoryResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PracticeRoundHistoryItem'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    PracticeRoundHistoryItem:
      type: object
      required: [round]
      properties:
        round:
          $ref: '#/components/schemas/Round'
        guess:
          anyOf:
            - $ref: '#/components/schemas/GuessResult'
            - type: 'null'
        actual_location:
          anyOf:
            - $ref: '#/components/schemas/RevealedLocation'
            - type: 'null'
    GuessResult:
      type: object
      required: [id, latitude, longitude, distance_meters, score, submitted_at, timed_out]
      properties:
        id:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        distance_meters:
          type: integer
          minimum: 0
        accuracy_score:
          type: integer
          minimum: 0
          maximum: 5000
          description: Distance-based accuracy points before speed bonus.
        speed_bonus:
          type: integer
          minimum: 0
          maximum: 250
          description: Ranked remaining-time bonus; zero for casual.
        score:
          type: integer
          minimum: 0
          maximum: 5250
          description: Accuracy plus speed bonus for this guess.
        submitted_at:
          type: string
          format: date-time
        timed_out:
          type: boolean
    RevealedLocation:
      type: object
      required: [latitude, longitude, country_code]
      properties:
        latitude:
          type: number
        longitude:
          type: number
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        region:
          type: [string, 'null']
        locality:
          type: [string, 'null']
    GameResultsResponse:
