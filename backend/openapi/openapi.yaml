                anyOf:
                  - $ref: '#/components/schemas/RankDetail'
                  - type: 'null'
    MatchProgression:
      type: object
      required: [applied]
      additionalProperties: false
      description: >
        Competitive impact for the caller. Casual always returns applied=false
        with reason "casual". Ranked includes old/new rating, base_delta,
        abandon_penalty (0 or -15 for the quitter only), total_delta, optional
        rank codes, placement progress while still placing, and top500_position
        when applicable. While Ranked finalization is still retrying, the
        results endpoint returns 202 progression_pending instead of this body
        (defensive projections may use reason progression_pending).
      properties:
        applied:
          type: boolean
        reason:
          type: string
          enum: [casual, progression_pending]
          description: >
            Present when applied is false. "casual" for non-competitive playlists;
            "progression_pending" only in defensive non-202 projections.
        old_rating:
          type: integer
          minimum: 0
        base_delta:
          type: integer
        abandon_penalty:
          type: integer
          description: >
            0 for non-quitters; -15 for the single abandoner on a Ranked forfeit.
            Never applied to teammates.
        total_delta:
          type: integer
        new_rating:
          type: integer
          minimum: 0
        old_rank:
          anyOf:
            - $ref: '#/components/schemas/RankCode'
            - type: 'null'
        new_rank:
          anyOf:
            - $ref: '#/components/schemas/RankCode'
            - type: 'null'
        placement:
          type: [integer, 'null']
          minimum: 1
          description: 1-based placement match number after this result while still placing.
        placements_completed:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
          description: Placement matches completed after this result (0–5).
        placements_required:
          type: [integer, 'null']
          enum: [5]
          description: Always 5 when placement fields are present.
        top500_position:
          type: [integer, 'null']
          minimum: 1
    MatchTerminalResultResponse:
      type: object
      required: [result, teams, progression]
      additionalProperties: false
      properties:
        result:
