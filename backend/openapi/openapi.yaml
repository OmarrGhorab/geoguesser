openapi: 3.1.0
info:
  title: GeoGuess API
  version: 0.1.0
  summary: REST API contract for the GeoGuess-style game.
  description: >
    Versioned API contract for authentication, profiles, maps, games, guesses,
    rooms, parties, matchmaking, multiplayer matches, leaderboards, billing
    placeholders, and health checks. Exact location coordinates are never
    returned before a guess is locked or a multiplayer round is revealed.
    Unknown request properties are rejected. Missing and unauthorized party or
    match resources both return privacy-safe not_found where revealing existence
    would leak information.
servers:
  - url: http://localhost/api/v1
    description: Local development through Nginx
  - url: http://localhost:8080/api/v1
    description: Local Go API direct
  - url: https://api.example.com/api/v1
    description: Production placeholder
security: []

tags:
  - name: Auth
  - name: Home
    description: Authenticated home-screen read models.
  - name: Profile
  - name: Uploads
  - name: Maps
  - name: Games
  - name: Rooms
  - name: Parties
    description: Casual/Ranked duo and squad party formation, invites, and readiness.
  - name: Matchmaking
    description: >
      Solo and party queue for casual and ranked playlists. Legacy ranked_standard
      join remains accepted as ranked solo.
  - name: Matches
    description: >
      Authorized multiplayer match snapshot, round results, terminal results, leave,
      team chat, mutes, and reports.
  - name: Realtime
    description: >
      One-time WebSocket tickets for party and match channels. The ticket is offered
      as a Sec-WebSocket-Protocol value ticket.{opaque} alongside geoguess.v1 and is
      never placed in URLs or logs.
  - name: Friends
  - name: Leaderboards
  - name: Competitive
    description: >
      Seasonal ranked profile, placement progress, 21 standard divisions, exclusive
      World Legend top 500, rating history, and closed-season leaderboard snapshots.
  - name: Challenges
  - name: Missions
  - name: Streaks
  - name: Billing
  - name: Webhooks
  - name: Health
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Creates a registered account, creates a profile, and sets auth cookies.
      operationId: registerUser
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: player@example.com
                  password: correct horse battery staple
                  display_name: Raven
      responses:
        '201':
          description: Registered and authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Validates credentials, rotates session state, and sets HTTP-only auth cookies.
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: player@example.com
                  password: correct horse battery staple
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes the current refresh session and clears auth cookies.
      operationId: logout
      security:
        - accessCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh auth session
      description: Rotates the refresh token and issues a new short-lived access token.
      operationId: refreshSession
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Session refreshed.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current session
      description: Returns a registered user session, a guest session, or anonymous state.
      operationId: getCurrentSession
      security:
        - accessCookie: []
        - guestSession: []
        - {}
      responses:
        '200':
          description: Current session summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'

  /home:
    get:
      tags: [Home]
      summary: Get authenticated home snapshot
      description: >
        Returns the active registered viewer, completed-game aggregate stats,
        current daily challenge metadata, and up to four active public maps in
        one coherent initial snapshot. Online friends, economy, progression,
        billing, and live mode activity are intentionally excluded.
      operationId: getAuthenticatedHome
      security:
        - accessCookie: []
      responses:
        '200':
          description: Authenticated home snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: Initiate OAuth sign-in
      description: Redirects the browser to the selected OAuth provider authorization endpoint.
      operationId: initiateOAuth
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: Redirect to OAuth provider.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      summary: OAuth callback
      description: Completes the OAuth flow, creates or links the account, and sets auth cookies.
      operationId: oauthCallback
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated via OAuth.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset OTP
      description: Sends a one-time password to the registered email address. Returns success even if the email is not registered to prevent enumeration.
      operationId: requestPasswordReset
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: OTP request accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with OTP
      description: Validates the OTP and updates the user's password. Invalidates all existing sessions.
      operationId: resetPassword
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /uploads:
    post:
      tags: [Uploads]
      summary: Create upload
      description: Creates a pending upload and returns a presigned URL for direct upload to R2.
      operationId: createUpload
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /uploads/complete:
    post:
      tags: [Uploads]
      summary: Complete upload
      description: Verifies the object exists in storage and records the file.
      operationId: completeUpload
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{fileId}/signed-url:
    get:
      tags: [Uploads]
      summary: Get signed download URL
      description: Returns a time-limited signed URL to download a private file.
      operationId: getSignedURL
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedURLResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /profile:
    get:
      tags: [Profile]
      summary: Get current profile
      operationId: getProfile
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Update current profile
      operationId: updateProfile
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated. Returns the same shape as GET /profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /users/{userId}/stats:
    get:
      tags: [Profile]
      summary: Get public user stats
      operationId: getUserStats
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile and aggregate stats. Only completed eligible games are counted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileResponse'
        '404':
          description: User is missing or unavailable. Response does not distinguish private account states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/games:
    get:
      tags: [Profile]
      summary: Get user game history
      operationId: getUserGameHistory
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Cursor-paginated, public-safe list of the user's games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGameHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: User is missing or unavailable. Response does not distinguish private account states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /maps:
    get:
      tags: [Maps]
      summary: List playable maps
      operationId: listMaps
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: access_tier
          in: query
          schema:
            $ref: '#/components/schemas/MapAccessTier'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/MapDifficulty'
      responses:
        '200':
          description: Public map list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /maps/{mapId}:
    get:
      tags: [Maps]
      summary: Get map metadata
      operationId: getMap
      parameters:
        - $ref: '#/components/parameters/MapId'
      responses:
        '200':
          description: Map metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /locations/{locationId}/media:
    get:
      tags: [Maps]
      summary: Get location media
      description: Returns media URL and attribution only when the requester is allowed to view the location media.
      operationId: getLocationMedia
      security:
        - accessCookie: []
        - guestSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: Location media without hidden coordinates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundMediaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games:
    post:
      tags: [Games]
      summary: Create a game
      description: Creates a Solo or Practice game for a registered or guest session. Practice starts with one untimed round and remains open-ended until explicitly ended.
      operationId: createGame
      security:
        - accessCookie: []
          csrfHeader: []
        - guestSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}:
    get:
      tags: [Games]
      summary: Get game state
      operationId: getGame
      security:
        - accessCookie: []
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game state visible to the participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/start:
    post:
      tags: [Games]
      summary: Start a game
      description: Starts a pending solo game, sets server-owned timestamps, and activates the first round.
      operationId: startGame
      security:
        - accessCookie: []
          csrfHeader: []
        - guestSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Game started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}/rounds/current:
    get:
      tags: [Games]
      summary: Get current round
      description: Returns current round data without true latitude, true longitude, location id, provider refs, or any hidden answer metadata.
      operationId: getCurrentRound
      security:
        - accessCookie: []
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Current round.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentRoundResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/rounds/next:
    post:
      tags: [Games]
      summary: Create the next Practice round
      description: Owner-only and Practice-only. Appends one untimed round after the current round is completed; durable idempotency does not require realtime or Redis.
      operationId: createNextPracticeRound
      security:
        - accessCookie: []
          csrfHeader: []
        - guestSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/IdempotencyKey'
          required: true
      responses:
        '200':
          description: Existing or newly created current Practice round.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentRoundResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The current round is incomplete (`current_round_incomplete`) or the game is not Practice (`wrong_game_mode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{gameId}/rounds:
    get:
      tags: [Games]
      summary: List bounded Practice round history
      operationId: listPracticeRounds
      security:
        - accessCookie: []
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Owner-only cursor page ordered by round number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeHistoryResponse'
        '400':
          description: Invalid limit or signed cursor (`invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The game is not Practice (`wrong_game_mode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{gameId}/end:
    post:
      tags: [Games]
      summary: End an open-ended Practice session
      operationId: endPracticeGame
      security:
        - accessCookie: []
          csrfHeader: []
        - guestSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Practice ended without deleting its history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The game is not Practice (`wrong_game_mode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{gameId}/rounds/{roundId}/guesses:
    post:
      tags: [Games]
      summary: Submit a guess
      description: >
        Submits one server-scored guess for the current round. Solo/daily responses
        reveal the answer immediately. Multiplayer responses keep actual_location
        null until the shared round closes (all eligible submissions or ranked
        deadline). Repeating the same Idempotency-Key with the same coordinates
        returns the original result; reusing it with different coordinates returns
        conflict (idempotency_conflict).
      operationId: submitGuess
      security:
        - accessCookie: []
          csrfHeader: []
        - guestSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitGuessRequest'
            examples:
              cairo:
                value:
                  latitude: 30.0444
                  longitude: 31.2357
      responses:
        '200':
          description: Guess accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuessResultResponse'
              examples:
                soloRevealed:
                  summary: Solo/daily immediate reveal
                  value:
                    guess:
                      id: 00000000-0000-4000-8000-0000000000a1
                      latitude: 30.0444
                      longitude: 31.2357
                      distance_meters: 12345
                      accuracy_score: 4020
                      speed_bonus: 0
                      score: 4020
                      submitted_at: "2026-07-18T10:02:25Z"
                      timed_out: false
                    round_completed: true
                    game_completed: false
                    actual_location:
                      latitude: 30.05
                      longitude: 31.24
                      country_code: EG
                    max_score: 5000
                    score_percent: 80
                    max_accuracy_score: 5000
                    max_speed_bonus: 250
                    outcome: close
                multiplayerDelayedReveal:
                  summary: Multiplayer delayed reveal (round still open)
                  value:
                    guess:
                      id: 00000000-0000-4000-8000-0000000000a2
                      latitude: 48.8566
                      longitude: 2.3522
                      distance_meters: 5432
                      accuracy_score: 4120
                      speed_bonus: 0
                      score: 4120
                      submitted_at: "2026-07-18T10:02:25Z"
                      timed_out: false
                    round_completed: false
                    game_completed: false
                    submitted_count: 3
                    eligible_count: 4
                    actual_location: null
                    max_score: 5000
                    score_percent: 82
                    max_accuracy_score: 5000
                    max_speed_bonus: 250
                    outcome: submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}/rounds/{roundId}/timeout:
    post:
      tags: [Games]
      summary: Advance an expired daily round
      description: Records a zero-score timeout after the server deadline, reveals the correct location, and activates the next round or completes the game.
      operationId: expireDailyRound
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/RoundId'
      responses:
        '200':
          description: Expired round advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuessResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /games/{gameId}/results:
    get:
      tags: [Games]
      summary: Get game results
      description: Returns durable final results for the owning player after a solo game is completed.
      operationId: getGameResults
      security:
