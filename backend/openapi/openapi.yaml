      type: object
      required: [kind, authenticated]
      properties:
        kind:
          type: string
          enum: [anonymous, guest, user]
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        guest:
          anyOf:
            - $ref: '#/components/schemas/GuestSession'
            - type: 'null'
    User:
