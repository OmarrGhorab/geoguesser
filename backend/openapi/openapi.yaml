  /matchmaking/queue:
    post:
      tags: [Matchmaking]
      summary: Enter matchmaking queue
      operationId: enterMatchmakingQueue
      description: |
        Registered-only join for casual or ranked playlists in solo, duo, or squad
        format. Solo omits party_id and creates an implicit one-user ticket.
        Duo/Squad require a complete ready party, caller as leader, and the
        current party version. First and concurrent joins for the same valid
        searching ticket preserve original search_started_at. A durable active
        assignment is returned as matched when present.

        Ranked also requires an active competitive season, a standing (visible or
        hidden placement rating) for every roster member, and no more than two
        named-rank tiers between highest and lowest party members. Placement
        players use hidden rating for the spread check and for team-average
        matchmaking. Ranked search windows start at ±100 team-average rating,
        expand by 50 every 30 seconds, and cap at ±400. Searching responses
        include rating_window for Ranked (absent for Casual).

        Legacy body `{ "mode": "ranked_standard" }` is accepted as ranked solo.
        Supplying both legacy mode and canonical playlist/format is
        invalid_mode_selection unless they are equivalent. Idempotency-Key is
        required for create-style joins.
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterMatchmakingRequest'
            examples:
              casualSolo:
                summary: Casual solo
                value:
                  playlist: casual
                  format: solo
              casualDuo:
                summary: Casual duo with party
                value:
                  playlist: casual
                  format: duo
                  party_id: 00000000-0000-4000-8000-0000000000b1
              rankedSquad:
                summary: Ranked squad
                value:
                  playlist: ranked
                  format: squad
                  party_id: 00000000-0000-4000-8000-0000000000b2
              legacyRankedStandard:
                summary: Legacy ranked_standard (ranked solo)
                value:
                  mode: ranked_standard
      responses:
        '202':
          description: Search accepted or existing search/match returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchmakingStatusResponse'
              examples:
                searching:
                  $ref: '#/components/examples/MatchmakingSearching'
                searchingRanked:
                  $ref: '#/components/examples/MatchmakingSearchingRanked'
                matched1v1:
                  $ref: '#/components/examples/MatchmakingMatched1v1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Matchmaking]
      summary: Leave matchmaking queue
      operationId: leaveMatchmakingQueue
      description: |
        Idempotent leave for a solo caller or party leader with a searching ticket.
        Returns 204 when the caller is not searching after the operation.
        Returns 409 match_already_formed when a durable assignment already exists
        (error details may include a safe match destination). Returns 409 while a
        claim is in progress; clients should refresh status.
      security:
        - accessCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Caller is not searching after the operation.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /matchmaking/status:
    get:
      tags: [Matchmaking]
      summary: Get matchmaking status
      operationId: getMatchmakingStatus
      description: |
        Durable-first status for the caller (and shared party ticket when queued
        as duo/squad). Searching renews the activity lease without changing queue
        priority. Never includes opponent identity or hidden game data.
        Legacy response fields mode, match_id, game_id, formed_at, and destination
        remain for compatible consumers; playlist/format/ticket_id/party_id are additive.
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current queue or match status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchmakingStatusResponse'
              examples:
                notQueued:
                  summary: Not queued
                  value:
                    status: not_queued
                    queue: null
                    match: null
                searching:
                  $ref: '#/components/examples/MatchmakingSearching'
                matched2v2:
                  $ref: '#/components/examples/MatchmakingMatched2v2'
                matched4v4:
                  $ref: '#/components/examples/MatchmakingMatched4v4'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

