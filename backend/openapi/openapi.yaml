components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived JWT access token in an HTTP-only secure cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotated refresh token in an HTTP-only secure cookie.
    guestSession:
      type: apiKey
      in: cookie
      name: guest_session
      description: Signed guest session cookie for anonymous gameplay.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for unsafe cookie-authenticated requests.
    paymentWebhookSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Provider-specific payment webhook signature.

  headers:
    SetCookie:
      description: HTTP-only auth or guest session cookie.
      schema:
        type: string

  parameters:

    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    RoomCode:
      name: roomCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{6,10}$'
    PlayerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
      description: Opaque HMAC-signed cursor scoped to the requested resource and filters.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable retry key for replay-safe writes. Identical requests replay the original successful result; conflicting reuse returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128

