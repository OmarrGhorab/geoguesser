    ChallengeAttemptSummary:
      type: object
      required: [id, challenge_id, status, leaderboard_eligible, total_score]
      properties:
        id:
          type: string
          format: uuid
        challenge_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, completed, abandoned, expired]
        leaderboard_eligible:
          type: boolean
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        total_score:
          type: integer
          minimum: 0
        current_round_number:
          type: [integer, 'null']
        game_id:
          type: [string, 'null']
          format: uuid
        daily_game_number:
          type: integer
          minimum: 1
          maximum: 5
    ChallengeCountdown:
      type: object
      required: [reset_ends_at, seconds_remaining]
      properties:
        reset_ends_at:
          type: string
          format: date-time
        seconds_remaining:
          type: integer
          minimum: 0
    CreateSharedChallengeRequest:
      type: object
      required: [map_id, round_count]
      additionalProperties: false
      properties:
        map_id:
          type: string
          format: uuid
        round_count:
          type: integer
          minimum: 1
          maximum: 10
        timer_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 600
        display_label:
          type: [string, 'null']
    ChallengeResultResponse:
      type: object
      required: [challenge, attempt, visible]
      properties:
        challenge:
          $ref: '#/components/schemas/ChallengeSummary'
        attempt:
          $ref: '#/components/schemas/ChallengeAttemptSummary'
        visible:
          type: boolean
        total_score:
          type: [integer, 'null']
          minimum: 0
        total_distance_meters:
          type: [integer, 'null']
          minimum: 0
        round_results:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeRoundResult'
        rank_context:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        streak:
          anyOf:
            - $ref: '#/components/schemas/StreakSummary'
            - type: 'null'
        missions_summary:
          type: array
          items:
            $ref: '#/components/schemas/MissionSummary'
        message:
          type: string
    ChallengeRoundResult:
      type: object
      required: [round_number, score, distance_meters]
      properties:
        round_number:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 0
        distance_meters:
          type: integer
          minimum: 0
    ChallengeLeaderboardResponse:
      type: object
      required: [challenge, entries, page]
      properties:
        challenge:
          $ref: '#/components/schemas/ChallengeSummary'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeLeaderboardEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    ChallengeLeaderboardEntry:
      type: object
      required: [rank, display_name, score, completed_at]
      properties:
        rank:
          type: integer
          minimum: 1
        display_name:
          type: string
        score:
          type: integer
          minimum: 0
        completion_duration_ms:
          type: [integer, 'null']
        completed_at:
          type: string
          format: date-time
        current_player:
          type: boolean
    StreakSummary:
      type: object
      required: [current_count, best_count, status, protection_state, guest_limited]
      properties:
        current_count:
          type: integer
          minimum: 0
        best_count:
          type: integer
          minimum: 0
        last_completed_challenge_date:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [active, broken, protected, inactive]
        protection_state:
          type: string
          enum: [none, available, consumed, expired]
        guest_limited:
          type: boolean
    MissionsResponse:
      type: object
      required: [missions]
      properties:
        missions:
          type: array
          items:
            $ref: '#/components/schemas/MissionSummary'
    MissionSummary:
      type: object
      required: [code, mission_key, title_key, description_key, mission_type, cadence, period_key, icon_key, reward_xp, current_value, target_value, status]
      properties:
        id:
          type: [string, 'null']
          format: uuid
        code:
          type: string
          description: Unique mission instance identifier, scoped to its daily or weekly period.
        mission_key:
          type: string
          description: Stable mission definition identifier for client copy and icon selection.
        title_key:
          type: string
        description_key:
          type: string
        mission_type:
          type: string
          enum: [daily_completion, shared_participation, score_threshold, leaderboard_milestone, streak_milestone, round_accuracy]
        cadence:
          type: string
          enum: [daily, weekly]
        period_key:
          type: string
          description: UTC reset period, formatted YYYY-MM-DD for daily or YYYY-Www for weekly.
        icon_key:
          type: string
          description: Stable key for the mission's UI icon.
        reward_xp:
          type: integer
          minimum: 0
          description: Account XP granted atomically when this completed mission is claimed.
        current_value:
          type: integer
          minimum: 0
        target_value:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [not_started, in_progress, completed, claimed, expired]
        active_ends_at:
          type: [string, 'null']
          format: date-time

    CreateRoomRequest:
      type: object
      required: [map_id, visibility]
      additionalProperties: false
      properties:
        map_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [private]
        round_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        timer_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 600
          default: 180
        max_players:
          type: integer
          minimum: 2
          maximum: 50
          default: 50
        display_name:
          type: string
          minLength: 2
          maxLength: 32
    JoinRoomRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]{6,10}$'
        display_name:
          type: string
          minLength: 2
          maxLength: 32
    UpdateRoomSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        map_id:
          type: string
          format: uuid
        round_count:
          type: integer
          minimum: 1
          maximum: 10
        timer_seconds:
          type: [integer, 'null']
          minimum: 10
          maximum: 600
        max_players:
          type: integer
          minimum: 2
          maximum: 50
    ReadyRoomRequest:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
    RoomResponse:
      type: object
      required: [room]
      properties:
        room:
          $ref: '#/components/schemas/Room'
    Room:
      type: object
      required:
        - id
        - code
        - visibility
        - status
        - version
        - max_players
        - round_count
        - expires_at
        - players
        - ready_player_ids
        - mode
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: [string, 'null']
          format: uuid
        host_player_id:
          type: [string, 'null']
          format: uuid
        current_player_id:
          type: [string, 'null']
          format: uuid
        code:
          type: string
        visibility:
          type: string
          enum: [private, public]
        status:
          type: string
          enum: [lobby, active, completed, expired, cancelled]
        version:
          type: integer
          minimum: 0
        max_players:
          type: integer
        round_count:
          type: integer
        timer_seconds:
          type: [integer, 'null']
        expires_at:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: '#/components/schemas/RoomPlayer'
        ready_player_ids:
          type: array
          items:
            type: string
            format: uuid
        current_round:
          anyOf:
            - $ref: '#/components/schemas/RoomCurrentRound'
            - type: 'null'
        guess_progress:
          anyOf:
            - $ref: '#/components/schemas/RoomGuessProgress'
            - type: 'null'
        mode:
          type: string
          const: party_lobby
          description: Product mode name; legacy private_room games use the same hosted-lobby contract.
        standings:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PartyLobbyStanding'

    PartyLobbyStanding:
      type: object
      required: [placement, player_id, display_name, total_score, total_distance_meters, rounds_scored, tied]
      properties:
        placement:
          type: integer
          minimum: 1
          maximum: 50
        player_id:
          type: string
          format: uuid
        display_name:
          type: string
        total_score:
          type: integer
          minimum: 0
        total_distance_meters:
          type: integer
          minimum: 0
        rounds_scored:
          type: integer
          minimum: 0
          maximum: 10
        tied:
          type: boolean

    RoomPlayer:
      type: object
      required: [id, display_name, role, membership_status, presence_status, is_ready, total_score, joined_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [host, player, spectator]
        membership_status:
          type: string
          enum: [joined, left, kicked, disconnected]
        presence_status:
          type: string
          enum: [connected, disconnected]
        is_ready:
          type: boolean
        total_score:
          type: integer
        joined_at:
          type: string
          format: date-time
        left_at:
          type: [string, 'null']
          format: date-time
    RoomCurrentRound:
      type: object
      required: [id, round_number, status, starts_at, ends_at, media, revealed]
      description: Hidden answer coordinates, location_id, and answer-revealing provider metadata are omitted until reveal.
      properties:
        id:
          type: string
          format: uuid
        round_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, active, completed, cancelled]
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        media:
          anyOf:
            - $ref: '#/components/schemas/RoundMedia'
            - type: 'null'
        revealed:
          type: boolean
    RoomGuessProgress:
      type: object
      required: [submitted_count, eligible_count, submitted_player_ids]
      description: Aggregate guess progress that never exposes guess coordinates or answer data before reveal.
      properties:
        submitted_count:
          type: integer
          minimum: 0
        eligible_count:
          type: integer
          minimum: 0
        submitted_player_ids:
          type: array
          items:
            type: string
            format: uuid

    Playlist:
      type: string
      enum: [casual, ranked]
      description: Match playlist.
    PartyFormat:
      type: string
      enum: [solo, duo, squad]
      description: Team size format. Solo is queue-only (no durable party).
    MatchMode:
      type: string
      description: >
        Canonical six-mode value. Legacy ranked_standard is accepted on join and
        normalized to ranked_solo in responses.
      enum:
        - casual_solo
        - casual_duo
        - casual_squad
        - ranked_solo
        - ranked_duo
        - ranked_squad
        - ranked_standard
    PartyStatus:
      type: string
      enum: [forming, queued, in_match, closed]
    MatchStatus:
      type: string
      enum: [matched, active, completed, cancelled, failed_to_start]
    MatchResult:
      type: string
      enum: [team_one_win, team_two_win, draw, forfeit, abandoned, cancelled]
    QueueStatus:
      type: string
      enum: [not_queued, searching, matched, temporarily_unavailable]

    EnterMatchmakingRequest:
      type: object
      additionalProperties: false
      description: >
        Prefer playlist + format (+ party_id for duo/squad). Legacy mode
        ranked_standard maps to ranked solo. Supplying both legacy and canonical
        fields is allowed only when they resolve to the same mode.
      properties:
        mode:
          type: string
          description: Deprecated single-field mode. ranked_standard maps to ranked_solo.
          enum:
            - ranked_standard
            - casual_solo
            - casual_duo
            - casual_squad
            - ranked_solo
            - ranked_duo
            - ranked_squad
        playlist:
          $ref: '#/components/schemas/Playlist'
        format:
          $ref: '#/components/schemas/PartyFormat'
        party_id:
          type: [string, 'null']
          format: uuid
          description: Required for duo/squad; must be null/omitted for solo.
    MatchmakingStatusResponse:
      type: object
      required: [status, queue, match]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/QueueStatus'
        queue:
          anyOf:
            - $ref: '#/components/schemas/MatchmakingQueue'
            - type: 'null'
        match:
          anyOf:
            - $ref: '#/components/schemas/MatchmakingMatch'
            - type: 'null'
    MatchmakingQueue:
      type: object
      required: [mode, search_started_at, lease_expires_at]
      additionalProperties: false
      description: >
        Searching payload. Legacy fields mode/search_started_at/lease_expires_at
        always present; ticket/playlist/format/party_id/rating_window are additive.
      properties:
        ticket_id:
          type: string
          description: Opaque v2 ticket identifier.
        playlist:
          $ref: '#/components/schemas/Playlist'
        format:
          $ref: '#/components/schemas/PartyFormat'
        mode:
          $ref: '#/components/schemas/MatchMode'
        party_id:
          type: [string, 'null']
          format: uuid
        search_started_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
        rating_window:
          anyOf:
            - $ref: '#/components/schemas/MatchmakingRatingWindow'
            - type: 'null'
          description: Present for ranked search; absent/null for casual.
    MatchmakingRatingWindow:
      type: object
      required: [minimum, maximum]
      additionalProperties: false
      properties:
        minimum:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
    MatchmakingMatch:
      type: object
      required: [match_id, game_id, mode, formed_at, destination]
      additionalProperties: false
      description: >
        Matched payload without opponent data. Legacy fields remain; playlist and
        format are additive. Destination may be /games/{game_id} (legacy) or
        /matches/{match_id} (match-centric clients).
      properties:
        match_id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        playlist:
          $ref: '#/components/schemas/Playlist'
        format:
          $ref: '#/components/schemas/PartyFormat'
        mode:
          $ref: '#/components/schemas/MatchMode'
        formed_at:
          type: string
          format: date-time
        destination:
          type: string
          description: Locale-independent application path such as /matches/{match_id} or /games/{game_id}.
          example: /matches/00000000-0000-4000-8000-0000000000c1

    CreatePartyRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [duo, squad]
          description: Solo does not create a durable party.
    SetPartyReadinessRequest:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
    CreatePartyInviteRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
    PartyMember:
      type: object
      required: [user_id, display_name, ready, is_leader, joined_at]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
        ready:
          type: boolean
        is_leader:
          type: boolean
        joined_at:
          type: string
          format: date-time
    Party:
      type: object
      required:
        - id
        - format
        - capacity
        - status
        - version
        - leader_user_id
        - members
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        format:
          type: string
          enum: [duo, squad]
        capacity:
          type: integer
          enum: [2, 4]
        status:
          $ref: '#/components/schemas/PartyStatus'
        version:
          type: integer
          minimum: 1
        leader_user_id:
          type: string
          format: uuid
        active_match_id:
          type: [string, 'null']
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/PartyMember'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PartyResponse:
      type: object
      required: [party]
      additionalProperties: false
      properties:
        party:
          $ref: '#/components/schemas/Party'
    CurrentPartyResponse:
      type: object
      required: [party]
      additionalProperties: false
      properties:
        party:
          anyOf:
            - $ref: '#/components/schemas/Party'
            - type: 'null'
    PartyInvite:
      type: object
      required: [id, party_id, format, capacity, expires_at, created_at, inviter]
      additionalProperties: false
      description: Invitation projection. Never reveals block ownership or private account data.
      properties:
        id:
          type: string
          format: uuid
        party_id:
          type: string
          format: uuid
        format:
          type: string
          enum: [duo, squad]
        capacity:
          type: integer
          enum: [2, 4]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        inviter:
          type: object
          required: [user_id, display_name]
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
            display_name:
              type: string
            avatar_url:
              type: [string, 'null']
    PartyInviteResponse:
      type: object
      required: [invite]
      additionalProperties: false
      properties:
        invite:
          $ref: '#/components/schemas/PartyInvite'
    PartyInviteListResponse:
      type: object
      required: [invites]
      additionalProperties: false
      properties:
        invites:
          type: array
          items:
            $ref: '#/components/schemas/PartyInvite'

    MatchViewer:
      type: object
      required: [user_id, game_player_id, team_slot, submitted, can_chat, allowed_spectate_player_ids]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        game_player_id:
          type: string
          format: uuid
        team_slot:
          type: integer
          enum: [1, 2]
        submitted:
          type: boolean
        can_chat:
          type: boolean
        allowed_spectate_player_ids:
          type: array
          items:
            type: string
            format: uuid
    MatchParticipant:
      type: object
      required: [game_player_id, user_id, display_name, status, submitted]
      additionalProperties: false
      description: >
        Roster entry. total_score may be omitted for opponents before round reveal.
      properties:
        game_player_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          type: string
          enum: [active, disconnected, left]
        submitted:
          type: boolean
        total_score:
          type: integer
          minimum: 0
    MatchTeam:
      type: object
      required: [slot, score, players]
      additionalProperties: false
      properties:
        slot:
          type: integer
          enum: [1, 2]
        score:
          type: integer
          minimum: 0
        players:
          type: array
          items:
            $ref: '#/components/schemas/MatchParticipant'
    MatchRoundMedia:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [panorama, image]
        panorama_id:
          type: string
          description: Provider-safe panorama reference (never raw storage keys).
        url:
          type: string
        attribution:
          type: [string, 'null']
    MatchRound:
      type: object
      required: [id, number, status, submitted_count, eligible_count]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, active, completed]
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
          description: Null for casual (no timer); set for ranked 60-second rounds.
        media:
          anyOf:
            - $ref: '#/components/schemas/MatchRoundMedia'
            - type: 'null'
        submitted_count:
          type: integer
          minimum: 0
        eligible_count:
          type: integer
          minimum: 0
    MatchTeamMarker:
      type: object
      required: [user_id, latitude, longitude, version]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        version:
          type: integer
          format: int64
    MatchTeamScore:
      type: object
      required: [slot, score]
      additionalProperties: false
      properties:
        slot:
          type: integer
          enum: [1, 2]
        score:
          type: integer
          minimum: 0
    RevealedGuess:
      type: object
      required:
        - game_player_id
        - user_id
        - team_slot
        - accuracy_score
        - speed_bonus
        - score
        - timed_out
      additionalProperties: false
      properties:
        game_player_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        team_slot:
          type: integer
          enum: [1, 2]
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        distance_meters:
          type: [integer, 'null']
          minimum: 0
        accuracy_score:
          type: integer
          minimum: 0
        speed_bonus:
          type: integer
          minimum: 0
        score:
          type: integer
          minimum: 0
        timed_out:
          type: boolean
        submitted_at:
          type: string
          format: date-time
    RevealedRoundResult:
      type: object
      required: [round_id, round_number, actual_location, guesses, teams]
      additionalProperties: false
      properties:
        round_id:
          type: string
          format: uuid
        round_number:
          type: integer
          minimum: 1
        actual_location:
          $ref: '#/components/schemas/RevealedLocation'
        guesses:
          type: array
          items:
            $ref: '#/components/schemas/RevealedGuess'
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/MatchTeamScore'
    MatchSnapshot:
      type: object
      required:
        - id
        - game_id
        - playlist
        - format
        - status
        - team_size
        - viewer
        - teams
        - team_markers
        - realtime_version
        - formed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        playlist:
          $ref: '#/components/schemas/Playlist'
        format:
          $ref: '#/components/schemas/PartyFormat'
        status:
          $ref: '#/components/schemas/MatchStatus'
        result:
          anyOf:
            - $ref: '#/components/schemas/MatchResult'
            - type: 'null'
        team_size:
          type: integer
          enum: [1, 2, 4]
        viewer:
          $ref: '#/components/schemas/MatchViewer'
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/MatchTeam'
        round:
          anyOf:
            - $ref: '#/components/schemas/MatchRound'
            - type: 'null'
        last_round_result:
          anyOf:
            - $ref: '#/components/schemas/RevealedRoundResult'
            - type: 'null'
        team_markers:
          type: array
          items:
            $ref: '#/components/schemas/MatchTeamMarker'
        realtime_version:
          type: integer
          format: int64
          minimum: 0
        formed_at:
          type: string
          format: date-time
        timer_seconds:
