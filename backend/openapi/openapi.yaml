          $ref: '#/components/schemas/ChallengeMetadataResponse'
        recommended_maps:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Map'
    HomeViewer:
      type: object
      required: [user_id, display_name]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        country_code:
          type: [string, 'null']
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'

    ProfileResponse:
      type: object
      required: [profile, stats, progress]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        stats:
          $ref: '#/components/schemas/UserStats'
        progress:
          $ref: '#/components/schemas/ProgressSummary'
    Profile:
      type: object
      required: [user_id, email, display_name, locale, experience_points, level, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
          description: HTTP(S) image reference ending in .jpg, .jpeg, .png, .webp, or .gif.
        country_code:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country code, returned in uppercase.
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        locale:
          type: string
          enum: [en, ar]
        timezone:
          type: [string, 'null']
          description: IANA timezone identifier. UTC is accepted; Local and abbreviation-only zones are rejected.
          pattern: '^(UTC|[A-Za-z_]+(?:/[A-Za-z0-9_+.-]+)+)$'
        preferences:
          type: object
          additionalProperties: false
          properties:
            distance_unit:
              type: string
              enum: [km, mi]
            theme:
              type: string
              enum: [system, light, dark]
        experience_points:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 32
        avatar_url:
          type: [string, 'null']
          format: uri
          description: HTTP(S) image reference ending in .jpg, .jpeg, .png, .webp, or .gif.
        country_code:
          type: [string, 'null']
          description: Case-insensitive ISO 3166-1 alpha-2 country code; stored and returned uppercase.
          minLength: 2
          maxLength: 2
          pattern: '^[A-Za-z]{2}$'
        locale:
          type: string
          enum: [en, ar]
        timezone:
          type: [string, 'null']
          description: IANA timezone identifier. UTC is accepted; Local and abbreviation-only zones are rejected.
          maxLength: 64
          pattern: '^(UTC|[A-Za-z_]+(?:/[A-Za-z0-9_+.-]+)+)$'
        preferences:
          type: [object, 'null']
          additionalProperties: false
          properties:
            distance_unit:
              type: string
              enum: [km, mi]
            theme:
              type: string
              enum: [system, light, dark]
    ProgressSummary:
