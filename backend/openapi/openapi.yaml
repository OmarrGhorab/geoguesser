          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [host, player, spectator]
        status:
          type: string
          enum: [active, disconnected, left, kicked]
        total_score:
          type: integer
          minimum: 0
    RoundResult:
      type: object
