      properties:
        round_id:
          type: string
          format: uuid
        round_number:
          type: integer
        actual_location:
          $ref: '#/components/schemas/RevealedLocation'
        guesses:
          type: array
          items:
            $ref: '#/components/schemas/GuessResult'


    ChallengeMetadataResponse:
