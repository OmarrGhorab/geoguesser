        terminal completion. Attachment metadata never includes storage keys or
        raw URLs.
      operationId: listMatchMessages
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Return messages with sequence strictly greater than this value.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
