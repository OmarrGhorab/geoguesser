      summary: Leave or abandon a match
      description: >
        Explicitly leave/abandon. Active Casual forfeits the caller's team without
        rating changes. Active Ranked forfeits the caller's team: only the quitter
        receives abandon facts and the eventual extra -15 penalty; teammates are
        not marked abandoned; opponents receive a normal win (winner_team_slot set)
        with base Elo only. Disconnect past the 90s reconnect grace uses the same
        forfeit path with abandon_reason disconnect_timeout. Terminal replay is
        idempotent 204 (no mutation of winner or abandon facts). Ranked progression
        remains pending until competitive finalization applies rating changes.
        Idempotency-Key is recommended for retries.
      operationId: leaveMatch
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveMatchRequest'
      responses:
        '204':
          description: Left the match (or already terminal).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

