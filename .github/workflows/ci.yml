name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoguess
          POSTGRES_PASSWORD: geoguess
          POSTGRES_DB: geoguess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoguess -d geoguess_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://geoguess:geoguess@localhost:5432/geoguess_test?sslmode=disable
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.2 -dir ./migrations postgres "$DATABASE_URL" up

      - name: Unit test suite
        run: go test ./...

      - name: Integration tests (PostgreSQL + Redis)
        env:
          DATABASE_URL: postgres://geoguess:geoguess@localhost:5432/geoguess_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/15
        run: go test -p 1 ./internal/friends/ ./internal/leaderboards/ ./internal/matchmaking/ ./internal/games/ ./internal/platform/redis/ ./internal/app/

      - name: Race tests (friends + leaderboards + matchmaking + games)
        env:
          DATABASE_URL: postgres://geoguess:geoguess@localhost:5432/geoguess_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/15
        run: go test -p 1 -race ./internal/friends/ ./internal/leaderboards/ ./internal/matchmaking/ ./internal/games/ ./internal/platform/redis/ ./internal/app/

      - name: Build
        run: go build ./cmd/api

      - name: Validate OpenAPI contract
        working-directory: backend
        run: npx -y @redocly/cli@2.38.0 lint ./openapi/openapi.yaml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        run: npm install -g pnpm@10.24.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: geoguess-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
